name: Check Play Store updates

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message instead of checking"
        type: boolean
        default: false

permissions:
  contents: write              # lets the job save state.json back to the repo

concurrency:
  group: playstore-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run checker
        env:
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          GREENAPI_INSTANCE_ID: ${{ secrets.GREENAPI_INSTANCE_ID }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python notifier.py --test
          else
            python notifier.py
          fi

      - name: Save state
        if: ${{ inputs.test != true }}
        run: |
          git config user.name "update-bot"
          git config user.email "update-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "Update state"
            git pull --rebase
            git push
          fi
